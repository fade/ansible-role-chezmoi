---
# Get latest version
- name: Get the latest version
  when: (chezmoi_version is not defined) or (chezmoi_version == 'latest')
  run_once: true
  block:
  - name: Determine latest GitHub release (local).
    delegate_to: localhost
    become: false
    # Force a local connection for the delegated task: in a remote play the
    # play's ssh settings would otherwise make this try to ssh to the control
    # host (e.g. fade@localhost), which fails.
    vars:
      ansible_connection: local
    ansible.builtin.uri:
      url: https://api.github.com/repos/{{ chezmoi_repo }}/releases/latest
      body_format: json
    register: _github_release
    # A request that fails outright returns no status at all, so comparing the
    # key directly raises instead of retrying, which is the one situation the
    # retry exists for. Defaulting it makes a failed attempt simply an attempt
    # that has not succeeded yet.
    until: (_github_release.status | default(0)) == 200
    retries: 5
    delay: 5

  - name: Set chezmoi_version.
    ansible.builtin.set_fact:
      chezmoi_version: "{{ _github_release.json.tag_name }}"

- name: Test if chezmoi is already installed.
  ansible.builtin.stat:
    path: /usr/local/bin/chezmoi
  register: cz

- name: Get installed version.
  ansible.builtin.command:
    cmd: /usr/local/bin/chezmoi --version
  changed_when: false
  register: cz_ver
  when: cz.stat.executable is defined and cz.stat.executable

- name: Parse version string.
  ansible.builtin.set_fact:
    chezmoi_installed_version: "{{ cz_ver.stdout | regex_search('chezmoi version ([^,]+)', '\\1') | first }}"
  when: cz_ver.rc is defined and cz_ver.rc == 0

- name: Download chezmoi.
  ansible.builtin.unarchive:
    src: https://github.com/{{ chezmoi_repo }}/releases/download/{{ chezmoi_version }}/chezmoi_{{ chezmoi_version | regex_replace("^v", "") }}_{{ go_os }}_{{ go_arch }}.tar.gz
    dest: /usr/local/bin
    include:
    - chezmoi
    remote_src: true
    owner: root
    group: '{{ root_group }}'
    mode: '0755'
  when: chezmoi_installed_version is not defined or chezmoi_installed_version != chezmoi_version

# The scheduled update is a systemd unit, so everything about it is skipped
# where systemd is not what runs the machine. FreeBSD is the case in hand: the
# role otherwise fails writing to a directory that does not exist there, having
# already installed chezmoi and applied the dotfiles perfectly well.
- name: Add update systemd service.
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.copy:
    src: chezmoi-update@.service
    dest: /etc/systemd/system/chezmoi-update@.service
    owner: root
    group: '{{ root_group }}'
    mode: '0644'
  notify: Reload daemons

- name: Add update systemd timer.
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.template:
    src: chezmoi-update@.timer.j2
    dest: /etc/systemd/system/chezmoi-update@.timer
    owner: root
    group: '{{ root_group }}'
    mode: '0644'
  notify: Reload daemons

# Only where there is a systemd unit for it to start. Installed anywhere else
# it is a command on the PATH that cannot work, and the error it gives names
# systemctl rather than saying that this host has no scheduled sync at all.
- name: Install the chezmoi-sync helper.
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.copy:
    src: chezmoi-sync
    dest: /usr/local/bin/chezmoi-sync
    owner: root
    group: '{{ root_group }}'
    mode: '0755'

# Reload now (not just via the end-of-play handler) so the per-user timer
# configuration and the optional immediate sync below can see freshly written
# units on a first run.
- name: Reload systemd so new units are known.
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true

- name: Initialize chezmoi for users.
  ansible.builtin.include_tasks: init.yml
  loop: '{{ chezmoi_users }}'
