---
- name: Get user home directory.
  ansible.builtin.getent:
    database: passwd
    split: ':'
    key: '{{ item.user }}'

- name: Init chezmoi.
  become: true
  become_user: '{{ item.user }}'
  ansible.builtin.command:
    cmd: /usr/local/bin/chezmoi init --apply {{ item.repo | default('') }}
    creates: "{{ getent_passwd[item.user][4] }}/.local/share/chezmoi"

- name: Configure update systemd timer.
  when: ansible_facts['service_mgr'] == 'systemd'
  vars:
    timer_on: '{{ (item.start_timer | default(chezmoi_update_timer_default)) | bool }}'
  ansible.builtin.systemd:
    name: chezmoi-update@{{ item.user }}.timer
    state: '{{ timer_on | ternary("started", "stopped") }}'
    enabled: '{{ timer_on }}'

# Bring an already-initialised host current immediately (init --apply above only
# runs on first setup). Triggers the same unit the timer uses, so systemd
# serializes it against any scheduled run; the oneshot blocks until it finishes.
- name: Force an immediate dotfiles sync.
  when:
    - chezmoi_update_now | bool
    - ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.command:
    cmd: systemctl start chezmoi-update@{{ item.user }}.service
  changed_when: true
