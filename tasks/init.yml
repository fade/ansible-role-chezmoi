---
- name: Get user home directory.
  ansible.builtin.getent:
    database: passwd
    split: ':'
    key: '{{ item.user }}'

- name: Init chezmoi.
  become: true
  become_user: '{{ item.user }}'
  ansible.builtin.command:
    cmd: /usr/local/bin/chezmoi init --apply {{ item.repo | default('') }}
    creates: "{{ getent_passwd[item.user][4] }}/.local/share/chezmoi"

- name: Configure update systemd timer.
  # start_timer is documented as optional (default false), but feeding an
  # undefined value straight into the systemd task errors out. Default it so an
  # entry that omits start_timer no longer fails the run.
  vars:
    timer_on: '{{ item.start_timer | default(false) | bool }}'
  ansible.builtin.systemd:
    name: chezmoi-update@{{ item.user }}.timer
    state: '{{ timer_on | ternary("started", "stopped") }}'
    enabled: '{{ timer_on }}'
